name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get ffprobe / ffmpeg
        shell: pwsh
        run: ./tools/get-tools.ps1

      - name: Get face models (optional feature)
        shell: pwsh
        run: ./tools/get-models.ps1

      - name: Test
        run: dotnet test tests/MediaOrganizer.Tests/MediaOrganizer.Tests.csproj -c Release

      - name: Publish standalone exe
        shell: pwsh
        run: |
          dotnet publish src/MediaOrganizer.App/MediaOrganizer.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -o dist/MediaOrganizer
          New-Item -ItemType Directory -Force dist/MediaOrganizer/tools | Out-Null
          Copy-Item tools/ffprobe.exe dist/MediaOrganizer/tools/ffprobe.exe
          Copy-Item tools/ffmpeg.exe dist/MediaOrganizer/tools/ffmpeg.exe
          Get-ChildItem dist/MediaOrganizer -File | Where-Object { $_.Extension -in '.lib', '.pdb' } | Remove-Item -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizer-win-x64
          path: dist/MediaOrganizer
